name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python = ">=3.9" in pyproject.toml.
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Only the core + dev extras: the whole suite runs headless with a mock
        # player, so no libmpv, no evdev, no display and no media files needed.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Check the example config still parses
        run: python -c "from retrobox.config import load_config; load_config('config.example.yaml')"

  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check the installer scripts
        run: for f in scripts/*.sh installer/*.sh; do bash -n "$f"; done

      - name: Lint with shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh installer/*.sh
