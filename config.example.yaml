# =============================================================================
# Retro Box configuration
# =============================================================================
# Copy this file to `config.yaml` (or /etc/retrobox/config.yaml) and edit it
# to match the folders on your drive. Validate it any time with:
#
#     retrobox --check
#
# There are two ways to define channels. Pick ONE.
#
# -----------------------------------------------------------------------------
# A NOTE ON THE SETTINGS THAT ARE CHECKED RATHER THAN OBEYED
# -----------------------------------------------------------------------------
# The dashboard has no password - that is deliberate, it is the same trade a
# LAN file share makes - and it can replace this whole file. So two kinds of
# setting in here are checked against a fixed list instead of being taken as
# written:
#
#   * ones that name a command the box runs: power_off_command,
#     input.cec_binary, input.cec_osd_name;
#   * ones that name a folder the box reads, writes or deletes inside:
#     media_root, each channel's path, a daypart's path, bumpers, assets_dir,
#     input.web_socket - and video_extensions, which is what tells the upload
#     page what a video is.
#
# Four smaller ones get the same treatment for the same reason: boot_splash has
# to name a video file, ui.font has to be a plain font name (it is spliced into
# the on-screen display's own markup), audio_device may not contain control
# characters, and input.keyboard_devices may only name things under /dev/input.
#
# A setting that does not pass is IGNORED, with the reason written to the
# journal (`journalctl -u retrobox`), and the box carries on with the default.
# It is never fatal: a config that refuses to load would take the picture away
# on a machine nobody can log into, which is far worse. The dashboard does
# refuse to SAVE a file like that, so you are told rather than left guessing.
#
# For folders: keep the library somewhere a library lives - an external drive
# (/mnt/..., /media/...), a network share, or a folder in your home such as
# ~/Videos. The system's own directories are refused (/etc, /boot, /usr, /opt,
# the parts of /var that hold cron jobs and services), and so are the folder
# Retro Box itself is installed in, its virtualenv, and your hidden dotfile
# folders (~/.ssh, ~/.config and the like). Your home directory ITSELF is
# refused too - use a folder inside it.

# -----------------------------------------------------------------------------
# OPTION A (easiest): auto-discover channels from a media folder.
# -----------------------------------------------------------------------------
# Point `media_root` at a folder; every sub-folder becomes a channel, named
# after the folder and numbered sequentially. Just drop folders in and go:
#
#   /media/retrobox/
#     ├── Sitcoms/               -> channel 2 "Sitcoms"
#     ├── Music Videos/          -> channel 3 "Music Videos"
#     └── Talk Shows/            -> channel 4 "Talk Shows"
#
# media_root: /media/retrobox
# first_channel_number: 2      # what the first discovered channel is numbered

# -----------------------------------------------------------------------------
# OPTION B (explicit): list channels yourself for full control of numbers/names.
# -----------------------------------------------------------------------------
channels:
  - number: 2
    name: "Sitcoms"
    path: /media/retrobox/sitcoms

  - number: 3
    name: "Music Videos"
    path: /media/retrobox/music-videos
    # Leave out things you don't want on this channel:
    exclude_seasons: ["6-25"]      # drop seasons 6 through 25 (detected from
                                   #   names like S06E01, "Season 6", 6x01)
    exclude: ["*bonus*"]           # drop any file/folder whose path matches
    # A channel whose `path` is media_root itself (nothing the box builds does
    # this, but you can write one by hand) can see the box's own folders: the
    # trash, the upload spool, the start-up clip. Left alone it would put
    # everything you deleted straight back on the air, so the first time
    # anything is deleted the box adds `.retrobox-trash/*`,
    # `.retrobox-uploads/*` and `.welcome/*` to that channel's `exclude` for
    # you and writes it to the log. Every other channel is left as written.
    # --- Dayparting (see the block below) ---
    # Music videos all day; after 10pm the same channel becomes something else.
    dayparts:
      - from: "22:00"
        to: "02:00"
        name: "AFTER HOURS"
        path: /media/retrobox/late-block

  - number: 4
    name: "Talk Shows"
    path: /media/retrobox/talk-shows
    # Air this channel in filename order rather than on shuffle - for a serial
    # you want to run from the start. Defaults to true (shuffled).
    shuffle: false

  - number: 5
    name: "Infomercials"
    path: /media/retrobox/infomercials
    # Nothing but infomercials in the small hours - and a hard sign-off after,
    # exactly like a station that ran out of day.
    dayparts:
      - from: "05:00"
        to: "18:00"
        off_air: true

  - number: 6
    name: "Movies"
    path: /media/retrobox/movies

# -----------------------------------------------------------------------------
# Dayparting: channels that change with the clock.
# -----------------------------------------------------------------------------
# Each entry under a channel's `dayparts:` is a wall-clock window that can:
#   name:     rename the channel while the window is open
#   path:     swap in a different folder of programming
#   off_air:  take the channel off the air (colour bars, no programme)
#
# Windows use 24-hour local time and may wrap past midnight ("22:00" -> "02:00"
# is the obvious late-night case). They are tested in the order you write them,
# so the first matching window wins. Outside every window the channel falls back
# to its own name and folder. A daypart with a `name` but no `path` just renames
# the channel and keeps the same shuffle running - the running order does not
# restart at 10pm. `off_air` and `path` are mutually exclusive.

# -----------------------------------------------------------------------------
# How a channel behaves when you tune into it.
#   random    - start a fresh random episode (the classic "flip and something is
#               on"); it starts a few seconds in (see start_offset), then keeps
#               rolling on shuffle.  [default]
#   resume    - pick up where you left off on that channel last time.
#   broadcast - the channel runs like a real always-on station: it advances in
#               real time even while you're watching something else, so you tune
#               in partway through whatever "would" be airing. (Needs ffprobe.)
# -----------------------------------------------------------------------------
tune_in: random

start_channel: 2          # which channel the box powers on to

# --- Boot splash -------------------------------------------------------------
# A clip played once at start-up, before the first channel is tuned. ON by
# default with the bundled JV Projects clip, so a box shows its own branding at
# power-up without being asked. Any button press skips it, a missing file is
# skipped with a warning rather than being an error, and a hard 30-second
# timeout means a bad clip can never strand the box on a splash screen.
#
#   boot_splash: false              go straight to a channel, no splash
#   boot_splash: boot_splash.mp4    the shipped clip (this is the default)
#   boot_splash: /media/mine.mp4    your own - see retrobox/assets/README.md
#                                   for the format it has to be in

# --- Station bumpers ---------------------------------------------------------
# A folder of short clips - idents, "we'll be right back", station promos - that
# play between episodes and stitch the night together. Leave it unset for none.
# A relative path is taken from media_root, so give it in full if you have not
# set one - the folder this config file lives in is inside the installed
# software, which is one of the places a folder of clips may not be.
# bumpers: /media/retrobox/bumpers
bumper_chance: 1.0        # 0-1: how often a bumper airs between episodes
bumper_max_seconds: 30    # hard cap, so one stray long file can't stall the box

# --- Sleep timer -------------------------------------------------------------
# The sleep button cycles through these durations (minutes) and then back to
# off. Set `sleep_timer: false` to disable the button entirely.
sleep_timer: [30, 60, 90]
# What happens when it runs out:
#   standby - blank the screen, leave the box running (press power to wake)
#   off     - shut the machine down cleanly, so it's safe to unplug
sleep_action: standby

# --- The "feel" of the TV ----------------------------------------------------
# Shows keep their own aspect ratio (4:3 is pillar-boxed, 16:9 fills the screen)
# and get the CRT curve/rounding. Set force_4_3:true to instead letterbox every
# show into a single 4:3 frame.
force_4_3: false

# Start each episode a random number of seconds in, between these two values, so
# channel switches land at varied points in the show (skips the black leader/
# intro too). Use a single number for a fixed offset, e.g. `start_offset: 5`.
# Set 0 if you genuinely want everything from the top. (`start_offset_min` and
# `start_offset_max` are accepted as separate keys and win over this one.)
start_offset: [6, 10]

# Channel-change effect: "none" (default), "glitch" (brief digital corruption),
# or "static" (analog snow).
transition: none
transition_duration: 0.4  # how long the effect shows (if not "none")

# With transition "none", keep the current show playing this many seconds while
# the next channel loads in the background, then cut over - so the picture never
# freezes on a channel change. 0 = switch immediately.
bridge_seconds: 0.8
channel_bug_seconds: 4    # how long the channel banner lingers
osd_duration: 2           # how long the volume bar / messages linger
guide_seconds: 8          # how long the on-screen channel guide stays up

# --- On-screen display look (the green digital readouts) ---------------------
ui:
  # A plain font name: letters, digits, spaces, '.', '_' and '-'. It is
  # spliced into the on-screen display's own markup, so anything else is
  # ignored and VT323 is used.
  font: "VT323"           # bundled retro terminal font (installed by install.sh)
  color: "#4DFF5A"        # phosphor green for CH banner, volume bar, guide
  dim_color: "#123B18"    # unlit volume dots (the segments not yet filled)
  glow: true              # soft CRT-style glow around the text

# --- CRT picture effect (for 4:3 shows on a flat TV) -------------------------
# Bends the picture like a tube TV: a gentle bulge, rounded corners, a vignette
# and faint scanlines. Set enabled:false if the box struggles or you dislike it.
crt:
  enabled: true
  curvature: 0.12         # 0 = flat, ~0.2 = strongly bulged
  corner_radius: 0.065    # how rounded the corners are
  vignette: 0.25          # edge darkening (0-1)
  scanlines: true
  scanline_intensity: 0.12

# --- Going quiet when the television is off ----------------------------------
# The box sits in a cabinet behind the set. With the set off it was decoding
# video for nobody: a fan roaring into an empty room and heat pumped into
# hardware that has already had one life. When it can see that nothing is
# watching, it PAUSES the picture - mpv stays running, the dashboard stays
# accurate, and it comes straight back.
#
# How it knows: the kernel says whether anything is plugged into the video
# output, and - only if this box has an HDMI-CEC adapter - the television's own
# word about its power. It never guesses: if it cannot tell, it stays awake.
# Some televisions keep the HDMI connection alive on standby and only drop it
# when switched off at the wall, so on those sets nothing happens without CEC.
display_sleep:
  # OFF until the dashboard half of this ships. The television side is
  # finished and works; what does not exist yet is the dashboard panel that
  # shows you the box has gone quiet and gives you a Wake button to bring it
  # back. Without that, a television that stayed black would look like a
  # broken box rather than a working one - so this waits for its other half.
  # Turn it on here if you want it now; everything below applies either way.
  enabled: false
  # How long the video output has to have been gone before the box believes
  # it. This is a debounce, not a countdown: switches and receivers drop the
  # line for a moment while they change input, and every one of those looks
  # like somebody switching the television off. Waking is never delayed.
  sleep_after_seconds: 8
  # What a channel that is NOT in broadcast mode does when the box wakes.
  # (A broadcast channel needs no setting: it works out what is airing from
  # the clock, so it always comes back where the station has got to.)
  #   resume  - carry on exactly where the picture was paused
  #   advance - skip forward by however long the box was quiet, because
  #             television does not wait for you
  non_broadcast: resume

# --- Audio -------------------------------------------------------------------
initial_volume: 70        # 0-100
volume_step: 5            # how much each volume press changes it
# Force audio to a specific output - for a TV you want HDMI, not the analog
# jack. Run `retrobox --list-audio` to see the names. On Intel machines the
# HDMI outputs hang off the onboard HDA controller, so the card is usually PCH.
# audio_device: "alsa/hdmi:CARD=PCH,DEV=0"   # try other DEV= for other ports

# Pressing volume-down once more when already at 0 cleanly shuts the machine
# down (needs the sudo rule from scripts/install-service.sh).
power_off_on_min_volume: true
# What "off" actually runs. This is the one setting in this file that names a
# command, so it is checked against a fixed list rather than taken as written:
# poweroff / systemctl poweroff / shutdown -h now / halt -p, on their own or
# behind sudo, or [] to disable switching off entirely. Anything else is
# ignored and "sudo poweroff" is used instead. The dashboard has no password,
# and it can replace this whole file.
# power_off_command: ["sudo", "poweroff"]   # override the shutdown command

# --- Playback ----------------------------------------------------------------
scan_recursive: true      # also look inside season sub-folders for episodes
# shuffle: true           # the DEFAULT for every channel that doesn't say.
                          #   A channel's own `shuffle:` always wins.
# Which files count as an episode. This is also what the upload page uses to
# decide what it is allowed to write to the disk, so only real video container
# suffixes are accepted - .mp4 .m4v .mkv .avi .mov .webm .ts .m2ts .mts .mpg
# .mpeg .vob .ogv .divx .flv .wmv .asf .3gp .mxf and the like. A list with
# anything else in it is ignored in full and the usual set is used.
# video_extensions: [".mp4", ".mkv", ".avi", ".m4v"]   # override if needed
# shuffle_seed: 1234       # set for a repeatable shuffle order (mostly for tests)

# --- Remote control input ----------------------------------------------------
# All backends are auto-detected; anything unavailable is skipped, so these are
# only needed to turn things off or fine-tune device selection.
input:
  keyboard: true          # USB/IR remotes & keyboards (via Linux evdev)
  cec: true               # the TV's own remote over HDMI-CEC (needs cec-utils)
  stdin: false            # developer keyboard over the terminal
  web: true               # the local socket the dashboard's buttons arrive on.
                          #   Set false and the WATCH tab's remote stops working;
                          #   everything else on the dashboard carries on.
  # keyboard_name_filter: "remote"   # only listen to devices whose name matches
  # keyboard_devices: ["/dev/input/event0"]  # or pin exact devices
  #   (must be under /dev/input - that is the only place a remote can be)
  # keyboard_grab: false             # true = stop keystrokes leaking to console

  # HDMI-CEC. cec_binary is the SECOND setting in this file that names a
  # program the box runs, so like power_off_command it is checked rather than
  # obeyed: it has to be libCEC's client ("cec-client", or a full path to
  # one). cec_osd_name is handed to that same command line as an argument, so
  # it is up to 14 plain characters starting with a letter or a digit - it is
  # what your TV shows in its input list. Neither is normally needed.
  # cec_binary: cec-client
  # cec_osd_name: "Retro Box"

  # Where the TV listens for the dashboard's button presses. Left unset it
  # goes in the systemd runtime directory, which is right on a real box. If
  # you do set it, it has to be an absolute path ending in ".sock" - whatever
  # it names is deleted at start-up before the socket is bound.
  # web_socket: /run/user/1000/retrobox/control.sock

  # Map specific keys to actions (handy for odd remotes). Find a button's key
  # name with `sudo evtest`. Actions: channel_up, channel_down, volume_up,
  # volume_down, mute, enter, info, guide, sleep, last_channel, power, quit,
  # digit_0..digit_9, or none (to unbind). Example for a Logitech R400
  # presenter. NOTE: its play-screen button sends Escape, which opens the
  # menu, so remap KEY_ESC if you would rather it did something else.
  # key_overrides:
  #   KEY_PAGEUP: channel_down    # left  (<) arrow
  #   KEY_PAGEDOWN: channel_up    # right (>) arrow
  #   KEY_ESC: volume_down        # play-screen button (sends Esc)
  #   KEY_F5: volume_down         #   ...and sometimes F5 - map both
  #   KEY_DOT: volume_up          # blank-screen button
  #   KEY_B: volume_up            #   ...blank button alt code - map both

# --- Automatic channels -------------------------------------------------------
# With this on, every top-level folder under media_root that isn't already a
# channel becomes one at start-up: next free number, folder name tidied up for
# the on-screen name. New channels are written back into this file so they
# persist and show up in `retrobox --check`.
#
# It is purely additive - a folder that already has a channel is left alone, so
# names and numbers you set by hand (or with `retrobox --setup`) are never
# overwritten. Folders with no video files in them are skipped.
#
#
# The first time anything automatic edits this file, a copy of it as you wrote
# it is kept next to it as config.yaml.bak, and that copy is never written
# again. If an edit ever goes wrong, that is the file to restore.
#
# Needs media_root set. Off by default.
# media_root: /media/retrobox
# auto_channels: true


# ---------------------------------------------------------------------------
# The LAN dashboard's limits
# ---------------------------------------------------------------------------
# The dashboard at http://retrobox.local/dash can create and rename channels and
# upload videos. Like the file share it has no login, so these two limits are
# what stop somebody on your network filling the disk - and a full disk on this
# box is a unit that will not start.
#
# Uploads are already restricted to video files landing inside media_root;
# these bound how much space they may take.
#
# web:
#   max_upload_mb: 8192    # biggest single upload accepted (default 8 GB)
#   min_free_mb: 1024      # always leave this much free. Measured on BOTH the
#                          #   disk the upload waits on and the disk it is
#                          #   headed for - a channel can point at a plugged-in
#                          #   drive, and that is the one that fills up.
#
# Uploading from the browser sends the file in pieces, so a dropped wifi
# connection or a closed tab resumes instead of starting over. The pieces live
# in a hidden .retrobox-uploads folder under media_root - never inside a
# channel, so a half-uploaded film is never mistaken for an episode - and
# anything abandoned is cleared off after upload_expiry_hours. Single videos and
# a replacement boot splash wait in there too while they arrive, so what a power
# cut leaves behind is counted on the Settings page and cleared by the same
# timer instead of sitting in a channel folder where nothing would ever find it.
#
#   chunk_mb: 8              # size of each piece a file is sent in
#   max_files_per_upload: 500
#   max_upload_sessions: 4
#   upload_expiry_hours: 24


# ---------------------------------------------------------------------------
# Software updates
# ---------------------------------------------------------------------------
# The box checks github.com for a newer tagged release about once a day and
# tells you in the dashboard what changed. Where it looks is compiled in - it
# cannot be pointed anywhere else, by anyone.
#
# Checking and applying are separate on purpose. Checking is harmless. Applying
# on its own is not: one bad release would take out every box at the same
# moment, in living rooms, with no way in to fix them. So installing is always a
# button press on the dashboard, and nothing in this file can change that.
#
# `auto_apply` is accepted here and reported by the dashboard, but NOTHING READS
# IT to install anything - there is no self-applying path in the code at all.
# It is left documented rather than removed because a config that sets it to
# true loads without complaint and still never self-updates, and that is worth
# knowing before you rely on it in either direction.
#
# A box with no internet is unaffected either way - the check fails quietly and
# the television carries on.
#
# updates:
#   check: true              # look for new versions (default: true)
#   auto_apply: false        # accepted, reported, and acted on by nothing
#   check_interval_hours: 24 # how often to look, smeared so a fleet does not
#                            #   all arrive at GitHub in the same second


# ---------------------------------------------------------------------------
# The clock
# ---------------------------------------------------------------------------
# This matters more here than on most machines. Dayparts (above) change what a
# channel IS by the time of day, and they do it silently: a box on the wrong
# timezone does not error, it just plays cartoons at ten at night and the
# feature looks broken.
#
# Nothing ever tells a freshly installed box where in the world it is. Ubuntu's
# systemd-timesyncd gets the box correct UTC, but the timezone stays on the
# installer's default. So the first time it starts up, the box asks a public
# internet service which timezone its internet address is in, and sets it - a
# named zone like Australia/Melbourne, never a fixed offset, because a named
# zone gets daylight saving right forever and an offset is wrong for half of
# every year.
#
# WHAT THAT SENDS. This is the only thing about the clock that leaves the box.
# It is the request and nothing else: no name, no serial number, no version,
# nothing about you and nothing about what you watch. The service sees the same
# public internet address your web browser shows any website. It happens once,
# and again only if the box is moved onto a different connection - not on every
# start-up, so a box behind a VPN does not go wandering between timezones.
#
# It NEVER overrides a timezone somebody chose. Pick one on the dashboard's
# System page and that is the end of it: detection may say what it thinks, but
# it will not change it back.
#
# Set this to false and the box never makes that request at all. It also never
# works out its own timezone, so set one yourself on the System page - which is
# also what a box with no internet needs.
#
# time:
#   detect_timezone: true    # work the timezone out from this box's location
#
# A FLAT BATTERY. Separately from any of the above: if the dashboard says this
# box's clock is wrong, and it is wrong again every time the box is switched
# off at the wall, the coin-sized battery on the motherboard is flat. It is a
# CR2032, about two dollars, and any computer shop will fit one. Until then a
# box with internet fixes its own clock a few seconds after it starts; a box
# without internet plays the wrong things all day.


# ---------------------------------------------------------------------------
# Where the generated filler clips live
# ---------------------------------------------------------------------------
# The colour bars, static and glitch clips that scripts/install.sh generates,
# and where the dashboard puts a boot splash you upload. Left unset it is the
# folder inside the installed software, which is where the shipped clips are
# and is almost always what you want. It is one of the folders the box WRITES
# into, so it is checked the same way media_root is - the bundled folder is
# allowed through explicitly, anywhere else has to be a sensible place.
# assets_dir: /media/retrobox/.retrobox-assets


# ---------------------------------------------------------------------------
# Bumpers per channel
# ---------------------------------------------------------------------------
# Station idents play between episodes on every channel by default. A channel
# can opt out - a news or music channel with idents between items is wrong
# rather than nostalgic:
#
#   - number: 4
#     name: "Music Videos"
#     path: /media/retrobox/music-videos
#     bumpers: false
