[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrobox"
# Derived from retrobox/__init__.py rather than written here. One number,
# one place: the box compares its own __version__ against the newest
# release tag to decide whether to update, so a second copy that drifts
# means every unit in the field reinstalls the same release for ever.
dynamic = ["version"]
description = "A retro TV media player for a small Linux box - fixed channels, shuffled episodes, dayparting, station bumpers and a sleep timer, with an authentic late-night cable feel."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "JV Projects" }]
keywords = ["media-player", "retro-tv", "mpv", "nostalgia", "crt", "iptv", "htpc"]

# Core runtime dependency. The hardware-specific dependencies (python-mpv,
# evdev) live in the optional "hardware" extra so the pure logic can be
# developed and tested on any machine, including macOS and Windows.
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Everything needed to actually drive a TV from the box itself. Both wrap
# system libraries (libmpv, libevdev) that scripts/install.sh installs first.
hardware = [
    "python-mpv>=1.0.5",
    "evdev>=1.6.1",
]
# The LAN web dashboard. Separate from `hardware` because it runs as its
# own service and a box without it is perfectly usable.
web = [
    "Flask>=3.0",
]
dev = [
    "pytest>=7.0",
    "Flask>=3.0",
]

[project.scripts]
retrobox = "retrobox.__main__:main"
# Not webui:main. The dashboard's start-up has one job to do before it serves
# anything - deciding whether the version this box was updated to actually came
# up - and retrobox/webservice.py is where that happens. Point this back at
# webui:main and the box silently stops being able to roll itself back.
retrobox-web = "retrobox.webservice:main"

[tool.setuptools.dynamic]
version = {attr = "retrobox.__version__"}

[tool.setuptools.packages.find]
include = ["retrobox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
